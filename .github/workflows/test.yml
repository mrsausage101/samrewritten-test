name: Steam Game Idler Linux Smoke Test

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: sgi-smoke-test
  cancel-in-progress: false

jobs:
  sgi-smoke-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Install Linux GUI runtime dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb libwebkit2gtk-4.1-0 libgtk-3-0 libssl3 libayatana-appindicator3-1

      - name: Download latest Steam Game Idler AppImage
        shell: bash
        run: |
          set -euo pipefail
          release_json="$(mktemp)"
          curl --fail --silent --show-error --location \
            https://api.github.com/repos/zevnda/steam-game-idler/releases/latest \
            -o "$release_json"

          asset_url="$(python3 - "$release_json" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as f:
              release = json.load(f)
          assets = release.get("assets", [])
          match = next((a for a in assets if a.get("name", "").endswith("_amd64.AppImage")), None)
          if not match:
              raise SystemExit("No Linux x86_64 AppImage found in latest SGI release")
          print(match["browser_download_url"])
          PY
          )"

          curl --fail --silent --show-error --location "$asset_url" -o "$RUNNER_TEMP/sgi.AppImage"
          chmod +x "$RUNNER_TEMP/sgi.AppImage"
          echo "Downloaded the latest Steam Game Idler AppImage."
          "$RUNNER_TEMP/sgi.AppImage" --appimage-extract >/dev/null
          echo "AppImage extraction succeeded."
          echo "SGI_ROOT=$PWD/squashfs-root" >> "$GITHUB_ENV"

      - name: Smoke-test application startup
        shell: bash
        run: |
          set -uo pipefail
          # This checks that the desktop app can start in a virtual display.
          # It deliberately does not sign in, store credentials, or idle games.
          set +e
          timeout --signal=TERM 20s xvfb-run -a "$SGI_ROOT/AppRun" >"$RUNNER_TEMP/sgi-smoke.log" 2>&1
          code=$?
          set -e
          if [ "$code" -eq 124 ] || [ "$code" -eq 143 ]; then
            echo "PASS: SGI remained running for the 20-second startup smoke test."
          elif [ "$code" -eq 0 ]; then
            echo "PASS: SGI exited normally during startup smoke test."
          else
            echo "SGI startup smoke test failed (exit code $code). Last log lines:"
            tail -n 60 "$RUNNER_TEMP/sgi-smoke.log" || true
            exit "$code"
          fi
